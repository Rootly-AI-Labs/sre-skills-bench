[project]
name = "terraform-generation-bench"
version = "0.1.0"
description = "SRE-skills-bench: Terraform — evaluate LLMs on generating executable Terraform from natural-language prompts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "boto3>=1.40.0",
    "openai>=2.0.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "rich>=14.0.0",
]

[dependency-groups]
dev = ["ruff>=0.17.2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
