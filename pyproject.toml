[project]
name = "sre-skills-bench"
version = "0.1.0"
description = "Benchmark suite for evaluating LLMs on Site Reliability Engineering tasks. Each sub-benchmark under benchmarks/ is self-contained with its own pyproject."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adjusttext>=1.4.0",
    "matplotlib>=3.11.0",
]

[dependency-groups]
dev = ["ruff>=0.17.2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["plot_benchmark"]
